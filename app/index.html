<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bite Flow</title>
<meta name="theme-color" content="#FFC2DE">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<section id="login" class="login" hidden data-state="form">
  <div class="login-card">
    <div class="script login-logo">Amylicious</div>
    <div class="login-loading">Loading your orders…</div>
    <form id="loginForm" class="login-form">
      <h1 class="login-title">Sign in</h1>
      <label>Email <input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>Password <input id="loginPass" type="password" autocomplete="current-password" required></label>
      <p id="loginErr" class="login-err" role="alert"></p>
      <p id="loginInfo" class="login-info" role="status"></p>
      <button id="loginSubmit" class="primary wide" type="submit">Sign in</button>
      <button id="forgotBtn" class="link forgot" type="button">Forgot password?</button>
      <div class="or">or</div>
      <button id="googleBtn" class="wide" type="button"><svg class="gicon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.300 0 11.600-2.100 15.500-5.700l-7.500-5.800c-2.100 1.400-4.800 2.300-8 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg> Sign in with Google</button>
    </form>
  </div>
</section>
<header class="banner">
  <div class="banner-in">
    <svg class="bow bow-l" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 33C22 20 7 19 9 29c2 10 16 8 23 4z"/><path d="M32 33C42 20 57 19 55 29c-2 10-16 8-23 4z"/><path d="M32 33c-4 9-8 17-10 25"/><path d="M32 33c4 9 8 17 10 25"/></svg>
    <div class="brand">
      <div class="script">Amylicious</div>
      <div class="tag">Order Tracker</div>
    </div>
    <div class="hbtns">
      <button id="syncPill" class="pill" data-state="local" aria-label="Account and sync status"><i class="pdot"></i><span class="pill-t">Local only</span></button>
      <button id="prodBtn" aria-label="Products"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg> <span class="lbl">Products</span></button>
      <button id="exportBtn" aria-label="Export to Excel"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg> <span class="lbl">Export to Excel</span></button>
      <button id="newBtn" class="primary"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New order</button>
    </div>
  </div>
</header>
<main>
  <section class="col" data-status="new"><h2>New <span class="count"></span></h2><div class="list"></div></section>
  <section class="col" data-status="ready"><h2>Ready <span class="count"></span></h2><div class="list"></div></section>
  <section class="col" data-status="delivered"><h2>Delivered <span class="count"></span>
    <button id="clearBtn" class="link">Clear</button></h2><div class="list"></div></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">New order</h3>
    <label>Customer name <input id="fName" placeholder="e.g. Priya" autocomplete="off" autocapitalize="words"></label>
    <div class="lbl">Items</div><div id="lines"></div><div id="noProd" class="hint" hidden>No products yet. Close this and add some under Products.</div><button type="button" id="addLine" class="addline"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add item</button>
    <div class="total"><span>Total</span><b id="dtotal"></b></div>
    <label>Notes <input id="fNotes" placeholder="e.g. pickup Sunday 11am" autocomplete="off"></label>
    <div class="actions">
      <button type="button" id="delBtn" class="danger">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="idlg">
  <h3>Upload this device's data?</h3>
  <p id="iText" class="a-status"></p>
  <p id="iErr" class="login-err" role="alert"></p>
  <div class="actions"><button type="button" id="iNever">Don't ask again</button><span class="spacer"></span><button type="button" id="iLater">Not now</button><button type="button" id="iUpload" class="primary">Upload</button></div>
</dialog>
<dialog id="adlg">
  <h3>Account</h3>
  <p id="aEmail" class="a-email"></p>
  <p id="aStatus" class="a-status"></p>
  <div class="actions"><button type="button" id="signOutBtn" class="danger" hidden>Sign out</button><span class="spacer"></span><button type="button" id="aClose">Close</button></div>
</dialog>
<dialog id="pdlg">
  <h3>Products</h3>
  <form id="pform" class="padd"><input id="pName" placeholder="New product" autocomplete="off"><input id="pPrice" type="number" min="0" step="any" placeholder="Price" aria-label="Price"><button class="primary">Add</button></form>
  <ul id="plist"></ul>
  <div class="actions"><button type="button" id="seedBtn">Add Amylicious menu</button><span class="spacer"></span><button type="button" id="pClose">Done</button></div>
</dialog>
<script src="firebase-config.js?v=17"></script>
<script src="vendor/firebase.js?v=17"></script>
<script src="store.js?v=17"></script>
<script src="auth.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
