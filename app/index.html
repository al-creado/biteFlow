<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>biteFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🍔 biteFlow</h1>
  <div class="hbtns"><button id="prodBtn">📋 Products</button><button id="exportBtn">⬇ Export to Excel</button><button id="newBtn" class="primary">+ New order</button></div>
</header>
<main>
  <section class="col" data-status="new"><h2>New <span class="count"></span></h2><div class="list"></div></section>
  <section class="col" data-status="ready"><h2>Ready <span class="count"></span></h2><div class="list"></div></section>
  <section class="col" data-status="delivered"><h2>Delivered <span class="count"></span>
    <button id="clearBtn" class="link">Clear</button></h2><div class="list"></div></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">New order</h3>
    <label>Name / table <input id="fName" placeholder="e.g. Sam or Table 4" autocomplete="off"></label>
    <div class="lbl">Items</div><div id="lines"></div><div id="noProd" class="hint" hidden>No products yet. Close this and add some under 📋 Products.</div><button type="button" id="addLine" class="addline">+ Add item</button>
    <label>Notes <input id="fNotes" placeholder="e.g. no onions" autocomplete="off"></label>
    <div class="actions">
      <button type="button" id="delBtn" class="danger">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="pdlg">
  <h3>Products</h3>
  <form id="pform" class="padd"><input id="pName" placeholder="New product, e.g. Cheeseburger" autocomplete="off"><button class="primary">Add</button></form>
  <ul id="plist"></ul>
  <div class="actions"><span class="spacer"></span><button type="button" id="pClose">Done</button></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
