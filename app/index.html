<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>biteFlow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🍔 biteFlow</h1>
  <button id="newBtn" class="primary">+ New order</button>
</header>
<main>
  <section class="col" data-status="new"><h2>New <span class="count"></span></h2><div class="list"></div></section>
  <section class="col" data-status="ready"><h2>Ready <span class="count"></span></h2><div class="list"></div></section>
  <section class="col" data-status="completed"><h2>Completed <span class="count"></span>
    <button id="clearBtn" class="link">Clear</button></h2><div class="list"></div></section>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle">New order</h3>
    <label>Name / table <input id="fName" placeholder="e.g. Sam or Table 4" autocomplete="off"></label>
    <label>Items (one per line) <textarea id="fItems" rows="6" placeholder="2x Cheeseburger&#10;1x Large fries&#10;1x Cola" required></textarea></label>
    <label>Notes <input id="fNotes" placeholder="e.g. no onions" autocomplete="off"></label>
    <div class="actions">
      <button type="button" id="delBtn" class="danger">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
