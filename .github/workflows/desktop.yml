name: Build desktop apps
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to tag, e.g. v1.0.0 (leave empty to only build)'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set app version from the release version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then V="$GITHUB_REF_NAME"; else V="${{ inputs.version }}"; fi
          V="${V#v}"
          if [ -n "$V" ]; then npm version "$V" --no-git-tag-version --allow-same-version; fi
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: amylicious-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/latest*.yml
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Amylicious ${{ inputs.version || github.ref_name }}
          files: dist/*
